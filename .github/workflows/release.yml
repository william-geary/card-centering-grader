name: release

# Builds the desktop apps with Tauri and attaches them to a GitHub release.
#
#     git tag v2.0.0
#     git push origin v2.0.0
#
# The tag must match "version" in package.json. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds and uploads artifacts to try, without releasing

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: --bundles nsis
          - os: macos-latest
            label: macos
            # One download for every Mac: Apple Silicon and Intel in one app.
            args: --bundles dmg --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ($want). Bump package.json, commit, and tag again."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Rust targets for a universal Mac build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      - name: Test before shipping
        run: npm test

      - name: Build the app
        run: npx tauri build ${{ matrix.args }}

      - name: Collect release files
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/CardCenteringGrader-${version}-windows-x64-setup.exe"
            cp src-tauri/target/release/card-centering-grader.exe "out/CardCenteringGrader-${version}-windows-x64-portable.exe"
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/CardCenteringGrader-${version}-macos-universal.dmg"
          fi
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Run even if one platform failed, so a broken Mac build does not hold
    # back a good Windows one; fail loudly only if nothing built at all.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Check something built
        run: |
          count=$(find artifacts -type f -name 'CardCenteringGrader-*' | wc -l)
          echo "found $count file(s)"
          ls -lR artifacts || true
          if [ "$count" -eq 0 ]; then
            echo "::error::Nothing was built. See the build jobs above."
            exit 1
          fi
          if [ "$count" -lt 3 ]; then
            echo "::warning::Only $count of 3 files built. Releasing those; check the failed build job."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          files=$(find artifacts -type f -name 'CardCenteringGrader-*')
          # A release made by hand in the web UI has no files; add to it rather
          # than failing because the release already exists.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --title "Card Centering Grader $tag" \
              --notes-file docs/release-notes.md
          fi
          echo "Done: $(gh release view "$tag" --json url --jq .url)"
