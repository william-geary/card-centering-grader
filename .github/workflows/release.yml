name: release

# Builds the Windows and macOS apps and attaches them to a GitHub release.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# GitHub then runs this on its own Windows and Mac machines, so you do not need
# to own each platform to publish for it. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # run it by hand from the Actions tab to test the
                              # build without publishing anything

permissions:
  contents: write             # needed to create the release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing should not bin the others
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest      # GitHub's macos-latest is Apple Silicon
            label: macos-arm64
          - os: macos-13          # the last Intel runner
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test before shipping
        run: |
          python tools/make_sample.py samples/sample_offset.png --dx 9 --dy -5
          python tools/make_sample.py samples/sample_rotated.png --dx 9 --dy -5 --rotate 4
          python tools/selftest.py

      - name: Build
        run: python build_app.py --package

      # A packaged GUI app that crashes on startup still "builds" fine, so try
      # to start it. This depends on the runner giving us a window server, which
      # is not guaranteed, so it reports rather than blocks -- read it as a hint,
      # not a gate. The self-test above is the real gate.
      - name: Smoke-check that it launches
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/CardCenteringGrader.exe &
          else
            ./dist/CardCenteringGrader.app/Contents/MacOS/CardCenteringGrader &
          fi
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 25s"
            kill "$pid" 2>/dev/null || true
          else
            echo "the app exited on its own"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/CardCenteringGrader-*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    # `needs: build` on its own would skip this whole job if ANY platform in
    # the matrix failed, so one broken Mac build would mean no release at all --
    # not even the Windows .exe that built perfectly well. `!cancelled()` lets
    # the job run anyway and ship whatever did build; the guard below fails
    # loudly if that turns out to be nothing.
    #
    # Only publish for a real tag: a manual run still builds and uploads
    # artifacts to try, but creates no release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be published
        run: ls -lR artifacts || true

      - name: Check something actually built
        run: |
          count=$(find artifacts -type f -name 'CardCenteringGrader-*' | wc -l)
          echo "found $count built app(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No apps were built - every platform failed. See the build jobs above."
            exit 1
          fi
          if [ "$count" -lt 3 ]; then
            echo "::warning::Only $count of 3 platforms built. Releasing those; check the failed build job."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # The release may already exist -- because a previous run made it, or
          # because it was created by hand in the web UI. A hand-made release
          # has no files attached, so upload into it rather than failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading the apps into it."
            gh release upload "$tag" artifacts/*/CardCenteringGrader-* --clobber
          else
            gh release create "$tag" artifacts/*/CardCenteringGrader-* \
              --title "Card Centering Grader $tag" \
              --notes-file docs/release-notes.md
          fi
          echo "Done: $(gh release view "$tag" --json url --jq .url)"
