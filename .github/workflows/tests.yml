name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build the sample cards
        run: |
          python tools/make_sample.py samples/sample_offset.png --dx 9 --dy -5
          python tools/make_sample.py samples/sample_rotated.png --dx 9 --dy -5 --rotate 4
      - name: Self-test
        run: python tools/selftest.py
