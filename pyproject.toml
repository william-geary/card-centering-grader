[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "card-centering-grader"
version = "1.0.0"
description = "Manual Pokemon card centering measurement with a three-stage GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "William Geary" }]
keywords = ["pokemon", "trading-cards", "centering", "grading", "psa", "bgs", "cgc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = ["pillow>=9.0", "numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/william-geary/card-centering-grader"
Issues = "https://github.com/william-geary/card-centering-grader/issues"

[project.gui-scripts]
cardgrader = "cardgrader.ui.app:main"

[tool.setuptools.packages.find]
include = ["cardgrader*"]
